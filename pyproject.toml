[project]
name = "aiodns-dnspy"
version = "0.0.0"
description = "asyncio DNS library (modernized from dnspy aiodns)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" collects coroutine test functions without per-test markers, so an
# async test cannot be silently skipped the way an unmarked one would be.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = [
  "E501", # line length handled by formatter / pragmatic
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
