[build-system]
# Declared explicitly rather than relying on pip's legacy setuptools fallback:
# without a build-system table, pip injects an unpinned setuptools+wheel
# environment, so builds are neither reproducible nor hermetic.
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "namespy"
dynamic = ["version"]
description = "Asyncio DNS library: iterative resolver, wire codec, and inspection CLI"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
keywords = ["dns", "asyncio", "resolver", "recursive", "wire-format", "packet-parsing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "hypothesis",
  "ruff",
  "mypy",
  # tools/check_dist.py runs after it, and CI cannot assert a wheel contains the
  # root hints without first being able to build one.
  "build",
]
# Named for the capability rather than the feature on purpose. DNSSEC validation is
# what asked for it, but a dependency called "dnssec" would have to be renamed the
# first time anything else needed arithmetic -- a TLSA association check (RFC 6698)
# or a signature over anything at all -- and renaming a published extra is a
# breaking change for every downstream that installed it.
#
# The floor is high and deliberately so: the project's own security policy is that
# "at any given time, we will provide security support for the main branch as well as
# the most recent release", and it statically links OpenSSL into its wheels, which has
# produced a recurring class of advisory ("Vulnerable OpenSSL included in cryptography
# wheels", three in the last two years) whose fix is to upgrade. A floor three years
# old would be a floor into unsupported code, which is worse than no floor at all.
#
# There is no ceiling. An upper bound in an optional extra of a *library* cannot
# protect anyone -- the application resolves the final set -- and it guarantees
# conflicts the moment something else in the environment needs a newer line. The
# newest release is what CI exercises, which is where a breakage would be noticed.
crypto = ["cryptography>=50.0.2"]

[project.urls]
Homepage = "https://github.com/b1tninja/namespy"
Repository = "https://github.com/b1tninja/namespy"
Issues = "https://github.com/b1tninja/namespy/issues"
Changelog = "https://github.com/b1tninja/namespy/blob/master/CHANGELOG.md"

[project.scripts]
# The CLI is the reason most people find this repo; making it an entry point
# means `pip install namespy` alone gives you `namespy example.com`.
namespy = "namespy.__main__:main"

[tool.hatch.version]
# Single source of truth: the distribution version is read from the package, so
# a release bump is one edit rather than two that can drift apart.
path = "namespy/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["namespy"]

[tool.hatch.build]
# Root hints are data, not code, and are read via importlib.resources. Named
# explicitly because hatchling's default excludes come from .gitignore, which
# ignores a *working-tree* named.root -- without this the wheel would ship a
# resolver with no starting point.
artifacts = ["namespy/named.root", "namespy/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "auto" collects coroutine test functions without per-test markers, so an
# async test cannot be silently skipped the way an unmarked one would be.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error::DeprecationWarning",
  # Leaked descriptors were a live bug here (the root-hints reader opened the
  # file and never closed it), and a ResourceWarning is only visible if
  # something asks for it. Escalated so a future unclosed file or socket fails
  # the ordinary run rather than surfacing only under -W in CI logs nobody
  # reads.
  "error::ResourceWarning",
]

[tool.coverage.run]
source = ["namespy"]
branch = true

[tool.coverage.report]
# A floor, not a target: it exists so CI notices a module losing its tests,
# which is the failure mode a parser-heavy library has to watch for.
#
# Measured by the Test job, which passes --cov — without that flag pytest never
# loads pytest-cov and this number is never read. See the comment on that step.
#
# Set just under the measured total rather than at a round aspirational number,
# because a gate that fails on arrival gets ignored, and an ignored gate protects
# nothing. It stays at 80 for now even though the suite measures 87.2% locally:
# that figure was taken on one platform and one Python, the gate fires on two of
# each, and a floor raised on a guess is the same failure as one never applied.
# Ratchet it from a number CI itself reports.
#
# Where the remaining 13% lives, and whether it is worth chasing:
#   resolver.py  78%  -- the real sockets and the root-hints bootstrap. Needs a
#                        live-network tier, not more unit tests; see below.
#   __main__.py  87%  -- the CLI's terminal-writing branches.
#   __init__.py  59%  -- the re-export table has no logic to test.
# Everything else measures 89% or better. Anything falling materially below
# these numbers is a module losing cover.
fail_under = 80
show_missing = true
exclude_lines = [
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
  "pragma: no cover",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "N", "UP", "SIM", "C4", "PT", "RUF", "S", "RET", "ARG"]
ignore = [
  "E501", # line length handled by formatter / pragmatic
  "S101", # asserts belong in tests, and this repo has a deliberate policy on them
  "S104", # the bundled test server is documented loopback-only; binding is the operator's choice
  "SIM105", # contextlib.suppress would hide which exception is being ignored in hot paths
]

[tool.ruff.lint.per-file-ignores]
# S101: the repo's policy is that assert belongs in tests and nowhere on a wire
# path. S311: a seeded random.Random is a deterministic test generator, not a
# token. ARG001/ARG002: a test double has to implement the real signature, so an
# unused parameter in a fake transport is the fake being correct, not dead code.
# SIM300: tests state "actual == expected" on purpose, because that is how the
# failure reads when it fires; ruff reads an enum member as a constant and wants
# it on the left, which would invert every assertion in the suite for style.
"tests/*" = ["S101", "S106", "S311", "ARG001", "ARG002", "SIM300"]
# The message and RDATA codecs mirror the wire format's own vocabulary: the
# header fields are ID/QR/OPCODE/AA/TC/RD/RA/Z/RCODE/QDCOUNT... and the RR
# classes are named after the mnemonics in the registry (RData_SOA, RData_AAAA).
# Renaming them to satisfy PEP 8 would break the one-to-one correspondence with
# RFC 1035 section 4.1.1 and RFC 3597 section 5 that makes this code auditable
# against the spec, so the naming exception is scoped to exactly these modules.
"namespy/packet.py" = ["N801", "N802", "N803", "N806"]
"namespy/rdata.py" = ["N801", "N802", "N806"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
# Advisory in intent, blocking in practice: CI runs `mypy namespy` without `||
# true`, and it exits 0. ignore_missing_imports stays on because the optional
# third-party integrations are genuinely absent from a minimal install, not
# merely unannotated. Do not turn on --strict globally: it measures 274 errors,
# 245 of them unannotated functions concentrated in resolver.py. Clear it
# per-module with [[tool.mypy.overrides]] instead.
ignore_missing_imports = true

