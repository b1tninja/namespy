version: 2
updates:
  # Only the dev extra resolves here -- the library itself declares no runtime
  # dependencies, which is a deliberate property of this codebase rather than an
  # oversight. Keeping the toolchain fresh is still worth a pull request, because
  # a stale ruff or pytest is what makes CI disagree with a local run.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      # One PR for the test/lint toolchain instead of five, since they are
      # upgraded together or not at all.
      dev-toolchain:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "hypothesis"
          - "build"

  # The actions themselves are third-party code executing with a repository
  # token, so their pins get the same review as dependencies.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"
