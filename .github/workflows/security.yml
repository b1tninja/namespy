name: Security

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly even without pushes, so a new CodeQL rule or a newly disclosed
    # advisory surfaces against this code. Push-triggered analysis only ever
    # asks about today's code with today's tools.
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Only Python source here ships logic; the workflow files themselves
        # are covered by review + Dependabot, not by a query pack.
        language: [python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended over security-and-quality: this is a parser
          # library whose real risk is hostile input, and the extended pack is
          # the one that queries for it. The quality queries are already
          # ruff's job and are enforced in ci.yml.
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    # Diff-aware: it flags a newly *introduced* dependency on the PR that
    # adds it, which no post-merge scanner does at the moment it matters.
    # Only meaningful on pull_request, where there is a base to diff against.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  pip-audit:
    # Audits the fully resolved dev-extra environment against the PyPA
    # advisory DB. The library itself declares zero runtime dependencies, so
    # what this can actually catch lives in the toolchain that builds, tests
    # and publishes it -- which is where a Python supply-chain attack lands.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -e ".[dev]" pip-audit
      - run: python -m pip_audit
